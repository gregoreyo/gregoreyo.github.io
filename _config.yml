title: gregoreyo
tagline: Software engineer & occasional speaker
description: >-
  Personal site — blog posts, conference talks, and projects.
url: "https://gregoreyo.github.io"
baseurl: ""

author:
  name: Your Name
  email: you@example.com
  github: gregoreyo
  # linkedin: your-linkedin-handle
  # twitter: your-handle

# --- Collections -------------------------------------------------------
collections:
  talks:
    output: true
    permalink: /talks/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
    values:
      layout: default

# --- Build ---------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
