title: gregoreyo
tagline: Security practitioner & speaker
description: >-
  Personal site — conference talks and projects. Blog and contact are hosted at anthonycastano.com.
url: "https://gregoreyo.github.io"
baseurl: ""

author:
  name: Anthony Castaño
  github: gregoreyo
  # linkedin: your-linkedin-handle
  # twitter: your-handle

# --- Collections -------------------------------------------------------
collections:
  talks:
    output: true
    permalink: /talks/:path/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
    values:
      layout: default

# --- Build ---------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
